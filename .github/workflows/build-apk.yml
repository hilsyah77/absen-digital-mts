name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🔨 Build HADIR.GURU Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: 📦 Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html android/app/src/main/assets/www/
          cp -r scripts android/app/src/main/assets/www/
          cp -r styles android/app/src/main/assets/www/
          cp -r assets android/app/src/main/assets/www/
          if [ -d data ]; then cp -r data android/app/src/main/assets/www/; fi
          echo "Web assets synced successfully to android assets."

      - name: 🚀 Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 📋 Prepare Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hadir-guru-mts.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk hadir-guru-vps.apk
          ls -lh hadir-guru-mts.apk hadir-guru-vps.apk

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HADIR-GURU-MTs-APK
          path: |
            hadir-guru-mts.apk
            hadir-guru-vps.apk
          retention-days: 90

      - name: 🏷️ Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HADIR.GURU MTs — APK Android VPS (absen.mtsasyjtb.cloud)"
          body: |
            ## 📱 Aplikasi Android HADIR.GURU MTs (Server VPS `absen.mtsasyjtb.cloud`)
            File APK siap pasang untuk smartphone Android guru dan administrator madrasah (Terhubung langsung ke VPS **`absen.mtsasyjtb.cloud`**).

            ### ✨ Detail Rilis:
            - **Nama Aplikasi**: HADIR.GURU
            - **Server Utama**: `http://absen.mtsasyjtb.cloud` (VPS MySQL)
            - **Paket**: `com.hadirguru.mts`
            - **Tipe**: Debug APK (Siap Pasang Langsung Tanpa Perlu Setup Keystore)

            ---

            ### 📥 Panduan Instalasi (Penting Jika Sebelumnya Pernah Pasang APK Lama):
            1. **Hapus (Uninstall)** terlebih dahulu aplikasi **HADIR.GURU** versi lama (Vercel) dari HP Anda.
            2. Unduh file **`hadir-guru-vps.apk`** di bawah ini.
            3. Buka file **`hadir-guru-vps.apk`** lalu klik **Pasang (Install)**.
            4. Izinkan akses **Lokasi** dan **Kamera** saat diminta.

            *Build otomatis oleh GitHub Actions (Commit: ${{ github.sha }}).*
          files: |
            hadir-guru-vps.apk
            hadir-guru-mts.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
