plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hadirguru.mts'
    compileSdk 34

    defaultConfig {
        applicationId "com.hadirguru.mts"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// Task to automatically synchronize web assets before building APK
tasks.register('syncWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html'
        include 'scripts/**'
        include 'styles/**'
        include 'assets/**'
        include 'data/**'
    }
    into "${projectDir}/src/main/assets/www"
}

preBuild.dependsOn syncWebAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
}
