# ==============================================================================
# KONFIGURASI NGINX VIRTUAL HOST - HADIR.GURU (ABSENSI DIGITAL MTSN 2 SEMARANG)
# Lokasi di VPS Ubuntu/Debian: /etc/nginx/sites-available/absen-digital
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan nama domain atau subdomain madrasah Anda (atau _ jika akses via IP)
    server_name absen.domainmadrasah.sch.id _;

    root /var/www/absen-digital;
    index index.html index.php;

    # Izinkan payload JSON besar (untuk sinkronisasi 649 jadwal KBM & foto profil)
    client_max_body_size 25M;

    # Kompresi Gzip agar loading di HP Guru sangat cepat
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Routing Halaman Utama Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Eksekusi Endpoint REST API PHP (/api/*.php)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Sesuaikan versi socket PHP-FPM di VPS Anda (misal php8.1-fpm.sock / php8.2-fpm.sock / php8.3-fpm.sock)
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Keamanan: Blokir akses publik ke file sensitif (.git, .sql, config.local.php)
    location ~ /\.(git|env|htaccess) {
        deny all;
    }

    location ~* (database\.sql|config\.local\.php|config\.local\.example\.php)$ {
        deny all;
    }
}

